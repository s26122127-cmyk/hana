<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 ✦ Telepathy Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #ffd6e0;
      /* Y2K 波點背景 */
      background-image: radial-gradient(#ff9ebb 15%, transparent 16%), radial-gradient(#ffc2d1 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
    }

    /* 3D 卡片翻轉效果 */
    .card-scene {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }

    /* Y2K 復古黑邊框風格 */
    .y2k-box {
      border: 3px solid #000;
      box-shadow: 5px 5px 0px #000;
    }
    .y2k-btn {
      border: 3px solid #000;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }
    .y2k-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-4">

  <!-- 頂部標題區 -->
  <header class="w-full max-w-xl flex justify-between items-center y2k-box bg-white p-4 rounded-2xl mb-4">
    <div>
      <h1 class="text-2xl font-black text-pink-500 tracking-wider">雲端心電感應 ✦</h1>
      <p id="roomBadge" class="text-xs font-bold text-purple-400">尚未進入房間</p>
    </div>
    <div class="flex items-center gap-2">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-gray-400" title="連線狀態"></div>
      <!-- 隱藏房主開關按鈕 (點擊切換房主控制台) -->
      <button id="secretHostBtn" onclick="toggleHostPanel()" class="text-xl p-1 hover:scale-110 transition-transform opacity-30 hover:opacity-100" title="隱藏房主控制台">👑</button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="w-full max-w-xl flex-1 flex flex-col justify-center">

    <!-- 階段 1：登入與選擇房間 -->
    <section id="loginSection" class="y2k-box bg-pink-100 p-6 rounded-3xl text-center space-y-4">
      <h2 class="text-xl font-bold text-pink-600">💖 歡迎來到心電感應</h2>
      <div class="space-y-3">
        <input type="text" id="playerNameInput" placeholder="請輸入你的暱稱..." class="w-full p-3 y2k-box rounded-xl font-bold outline-none focus:bg-pink-50" onkeyup="if(event.key==='Enter') joinRoom()">
        <input type="text" id="roomCodeInput" placeholder="輸入或創立房間號碼 (如: 888)" class="w-full p-3 y2k-box rounded-xl font-bold outline-none focus:bg-pink-50" onkeyup="if(event.key==='Enter') joinRoom()">
      </div>
      <button onclick="joinRoom()" class="w-full y2k-btn bg-pink-400 hover:bg-pink-500 text-white font-black py-3 rounded-xl text-lg">進入房間 🚀</button>
    </section>

    <!-- 階段 2：遊戲主要畫面 -->
    <section id="gameSection" class="hidden space-y-4">
      <!-- 題目顯示板 -->
      <div class="y2k-box bg-yellow-100 p-4 rounded-2xl text-center">
        <span class="text-xs font-black text-yellow-600 bg-yellow-200 px-2 py-1 rounded-full">CURRENT QUESTION</span>
        <h2 id="questionDisplay" class="text-xl font-black mt-2 text-slate-800">等待房主出題中... 💭</h2>
      </div>

      <!-- 玩家作答輸入區 -->
      <div id="answerForm" class="y2k-box bg-white p-4 rounded-2xl flex gap-2">
        <input type="text" id="playerAnswerInput" placeholder="輸入你的答案..." class="flex-1 p-2 border-2 border-slate-800 rounded-lg font-bold outline-none" onkeyup="if(event.key==='Enter') submitAnswer()">
        <button onclick="submitAnswer()" class="y2k-btn bg-purple-300 hover:bg-purple-400 px-4 py-2 rounded-lg font-black">送出 💌</button>
      </div>

      <!-- 3D 答案卡片展示牆 -->
      <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 pt-2">
        <!-- 動態生成的卡片放於此 -->
      </div>
    </section>

  </main>

  <!-- 隱藏房主控制台 (Modal) -->
  <div id="hostModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="y2k-box bg-white w-full max-w-md p-6 rounded-3xl space-y-4 relative">
      <button onclick="toggleHostPanel()" class="absolute top-4 right-4 text-gray-500 font-bold hover:text-black">✕</button>
      <h3 class="text-lg font-black text-purple-600 flex items-center gap-2">👑 隱藏房主控制台</h3>
      
      <div class="space-y-2">
        <label class="text-sm font-bold">設定本輪題目：</label>
        <input type="text" id="hostQuestionInput" placeholder="例如：夜市必買美食？" class="w-full p-2 border-2 border-slate-800 rounded-lg font-bold" onkeyup="if(event.key==='Enter') hostSetQuestion()">
        <button onclick="hostSetQuestion()" class="w-full y2k-btn bg-yellow-300 hover:bg-yellow-400 py-2 rounded-lg font-black">設定題目並開始 📢</button>
      </div>

      <hr class="border-slate-800">

      <div class="flex gap-2">
        <button onclick="hostReveal()" class="flex-1 y2k-btn bg-emerald-300 hover:bg-emerald-400 py-3 rounded-xl font-black text-lg">開牌！翻開所有卡片 🎴</button>
        <button onclick="hostReset()" class="y2k-btn bg-red-300 hover:bg-red-400 px-4 py-3 rounded-xl font-black">重置 🔄</button>
      </div>
    </div>
  </div>

  <!-- 頁腳 -->
  <footer class="mt-4 text-xs text-pink-600 font-bold">
    Y2K Telepathy Game ✦ Polling Enabled
  </footer>

  <script>
    // 指定參數
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwaQ2WFiaZzS2onCHejYyMrGZdTfCnCLkeCR_9SkGpk4wXzCW_z_brrI63WlbUGGQ/exec";

    // 全局變數
    let currentRoom = "";
    let playerName = "";
    let pollingInterval = null;
    let lastRenderedJson = "";

    const loginSection = document.getElementById('loginSection');
    const gameSection = document.getElementById('gameSection');
    const roomBadge = document.getElementById('roomBadge');
    const questionDisplay = document.getElementById('questionDisplay');
    const cardsGrid = document.getElementById('cardsGrid');
    const statusDot = document.getElementById('statusDot');

    // 1. 加入房間
    function joinRoom() {
      const roomInput = document.getElementById('roomCodeInput').value.trim();
      const nameInput = document.getElementById('playerNameInput').value.trim();

      if (!roomInput || !nameInput) {
        alert("請輸入暱稱與房間號碼！");
        return;
      }

      currentRoom = roomInput;
      playerName = nameInput;

      roomBadge.innerText = `房間號碼：${currentRoom} | 玩家：${playerName}`;
      loginSection.classList.add('hidden');
      gameSection.classList.remove('hidden');

      // 開啟 2.5 秒輪詢機制
      fetchGameState();
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(fetchGameState, 2500);
    }

    // 2. GET 抓取狀態
    async function fetchGameState() {
      if (!currentRoom) return;
      try {
        statusDot.className = "w-3 h-3 rounded-full bg-yellow-400 animate-pulse";
        const response = await fetch(`${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`);
        
        if (!response.ok) throw new Error("網路連線失敗");
        
        const data = await response.json();
        
        // 當遊戲狀態有實質改變時才繪製 UI，保留動畫連貫性
        const currentJson = JSON.stringify(data);
        if (currentJson !== lastRenderedJson) {
          lastRenderedJson = currentJson;
          updateUI(data);
        }
        
        statusDot.className = "w-3 h-3 rounded-full bg-emerald-400";
      } catch (err) {
        console.warn("Polling retry...", err);
        statusDot.className = "w-3 h-3 rounded-full bg-red-400";
      }
    }

    // 3. POST 更新資料 (採用 text/plain 避免跨域阻擋)
    async function sendPostAction(payload) {
      payload.room = currentRoom;
      statusDot.className = "w-3 h-3 rounded-full bg-yellow-400 animate-ping";
      
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        setTimeout(fetchGameState, 500);
      } catch (err) {
        console.error("POST Error:", err);
        alert("發送失敗，請檢查網路或 GAS 權限部署！");
        statusDot.className = "w-3 h-3 rounded-full bg-red-400";
      }
    }

    // 4. 更新 UI 與渲染卡片
    function updateUI(data) {
      questionDisplay.innerText = data.question ? data.question : "等待房主出題中... 💭";

      cardsGrid.innerHTML = "";
      const answers = data.answers || {};
      const playerNames = Object.keys(answers);

      if (playerNames.length === 0) {
        cardsGrid.innerHTML = `<div class="col-span-full text-center text-slate-500 font-bold py-8">目前還沒有玩家提交答案...</div>`;
        return;
      }

      const isRevealed = (data.status === "revealed");

      playerNames.forEach(name => {
        const answerText = answers[name];
        
        const cardScene = document.createElement('div');
        cardScene.className = "card-scene h-36 w-full";

        cardScene.innerHTML = `
          <div class="card-inner y2k-box rounded-2xl ${isRevealed ? 'is-flipped' : ''}">
            <!-- 卡片背面 (未開牌) -->
            <div class="card-front bg-pink-200 border-2 border-slate-800 flex flex-col items-center justify-center p-2 text-center">
              <span class="text-3xl mb-1">🎁</span>
              <span class="font-black text-sm text-slate-700">${name}</span>
              <span class="text-xs font-bold text-pink-500 mt-1">已準備好！</span>
            </div>
            <!-- 卡片正面 (已開牌) -->
            <div class="card-back bg-white border-2 border-slate-800 flex flex-col items-center justify-center p-2 text-center">
              <span class="text-xs font-black text-purple-400 uppercase">${name} 的答案</span>
              <span class="text-lg font-black text-slate-800 mt-1 break-all">${answerText}</span>
            </div>
          </div>
        `;
        cardsGrid.appendChild(cardScene);
      });
    }

    // 5. 提交答案
    function submitAnswer() {
      const answerInput = document.getElementById('playerAnswerInput');
      const val = answerInput.value.trim();
      if (!val) return alert("答案不能為空！");

      sendPostAction({
        action: "submit_answer",
        playerName: playerName,
        answer: val
      });
      answerInput.value = "";
    }

    // 6. 房主功能控制
    function toggleHostPanel() {
      const modal = document.getElementById('hostModal');
      modal.classList.toggle('hidden');
    }

    function hostSetQuestion() {
      const q = document.getElementById('hostQuestionInput').value.trim();
      if (!q) return alert("請輸入題目！");

      sendPostAction({
        action: "set_question",
        question: q
      });
      document.getElementById('hostQuestionInput').value = "";
      toggleHostPanel();
    }

    function hostReveal() {
      sendPostAction({ action: "reveal" });
      toggleHostPanel();
    }

    function hostReset() {
      if (confirm("確定要重置本房間的遊戲嗎？")) {
        sendPostAction({ action: "reset" });
        toggleHostPanel();
      }
    }
  </script>
</body>
</html>
